# docker-compose.yml — Local development stack
# Mirrors the production environment (Qdrant as a standalone service).
#
# Usage:
#   docker compose up --build
#
# Then open http://localhost:7860 for the Streamlit UI
#      and http://localhost:8000/docs for the FastAPI Swagger UI.
#
# Single-corpus demo mode: leave ALLOWED_REPOS empty to serve any repository
# that has a ready index. Set ALLOWED_REPOS=owner/name[,owner/name] to restrict
# queries and ingestion to those repositories. This is a corpus allow-list, not
# per-user authorization (API_KEY is one shared secret).

services:

  qdrant:
    image: qdrant/qdrant:v1.15.0
    container_name: gitmind-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # The image has no curl/wget; probe the REST port with bash's /dev/tcp.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build: .
    container_name: gitmind-api
    # No --reload: a code-change reload would kill in-flight ingestion jobs.
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      # Remote Qdrant (the service above). A URL selects remote mode; the API
      # key is optional and unused by this unauthenticated local service.
      QDRANT_URL: http://qdrant:6333
      # SQLite for local dev (no Postgres needed)
      DATABASE_URL: ""
      DB_PATH: data/gitmind.db
      GENERATIONS_DIR: data/generations
      JOBS_DB_PATH: data/jobs.db
      ALLOWED_REPOS: ${ALLOWED_REPOS:-}
      QUERY_TIMEOUT_S: ${QUERY_TIMEOUT_S:-120}
      # Keys
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      API_KEY: ${API_KEY:-}
    volumes:
      - .:/app
      - app_data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      # Liveness only; corpus readiness is GET /ready.
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  frontend:
    build: .
    container_name: gitmind-frontend
    command: >
      streamlit run interface/streamlit_app.py
        --server.port 7860
        --server.address 0.0.0.0
        --server.headless true
    ports:
      - "7860:7860"
    environment:
      GITMIND_API_URL: http://api:8000
      API_KEY: ${API_KEY:-}
    volumes:
      - .:/app
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:7860/_stcore/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  qdrant_storage:
  app_data:
